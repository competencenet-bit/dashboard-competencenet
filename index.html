  const container = document.getElementById('financeiro-extrato-lista');
  const statsDiv = document.getElementById('financeiro-stats-resumo');

  const ultimoMes = meses[0];
  const extrato = fin.extratos[ultimoMes];

  statsDiv.innerHTML = `

      <div style="font-weight:bold; font-size:1rem">R$ ${extrato.total.toLocaleString('pt-BR', {minimumFractionDigits:2})}</div>
    </div>
  `;

  let html = `<h3 style="font-size:0.9rem; margin: 15px 0 10px; border-bottom:1px solid #eee; padding-bottom:5px">Extrato ${extrato.banco}</h3>`;
  html += extrato.lancamentos.map(l => `
    <div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid #f9fafb">
      <div>
        <div style="font-weight:600">${l.descricao}</div>
        <div style="font-size:0.7rem; color:#9ca3af">${l.data} • ${l.categoria}</div>
      </div>
      <div style="font-weight:bold; color:#ef4444">R$ ${l.valor.toLocaleString('pt-BR', {minimumFractionDigits:2})}</div>
    </div>
  `).join('');

  if (fin.contratos_recorrentes) {
    html += `<h3 style="font-size:0.9rem; margin: 20px 0 10px; border-bottom:1px solid #eee; padding-bottom:5px">Contratos Recorrentes</h3>`;
    html += fin.contratos_recorrentes.map(c => `
      <div style="display:flex; justify-content:space-between; padding:4px 0">
        <div style="color:#4b5563">${c.empresa} (Dia ${c.venc_dia})</div>
        <div style="font-weight:600">R$ ${c.valor ? c.valor.toLocaleString('pt-BR', {minimumFractionDigits:2}) : '---'}</div>
      </div>
    `).join('');
  }

  container.innerHTML = html;
}

function renderCardsList(containerId, list, isConcluido = false) {
  const container = document.getElementById(containerId);
  
  // Aplicar filtro se houver
  let filteredList = list;
  if (state.aba === 'atendimentos' && state.filtro && state.filtro !== 'todos') {
    filteredList = list.filter(a => a.status === state.filtro);
  }

  if (!filteredList || filteredList.length === 0) {
    container.innerHTML = '<p style="text-align:center;color:#888;padding:40px">Nenhum item nesta categoria.</p>';
    return;
  }

  container.innerHTML = filteredList.map(a => {
    const emojiMap = { urgente:'🔴', andamento:'🟡', triagem:'🔵', financeiro:'💰', campo:'🛠️', instalacao:'📡', concluido:'✅' };
    const phoneClean = a.phone ? a.phone.replace(/\D/g, '') : '';
    const qgLink = `https://wa.me/5551997760717?text=Nota%20sobre%20${encodeURIComponent(a.cliente)}%3A%3A`;
    const emoji = emojiMap[a.status] || '📋';
    
    return `
      <div class="card ${a.status}" id="card_${a.id}">
        <span class="titulo">${emoji} ${a.cliente}</span>
        <div class="desc">${a.detalhes}</div>
        <div class="proximo">${a.proximo || ''}</div>
        
        <div style="margin-top:15px; display:flex; flex-wrap:wrap; gap:10px;">
          <button class="btn-v9-encerrar" onclick="encerrar('${a.id}',this)">✅ Encerrar</button>
          ${!isConcluido ? `<button class="btn-v9-lido" onclick="marcarLido('${a.id}',this)">👁️ Lido</button>` : ''}
          <button class="btn-v9-copiar" onclick="copiarContexto('${a.id}')">📋 Copiar</button>
          <button class="btn-v9-lido" style="background:#ea580c; color:#fff" onclick="window.open('${qgLink}','_blank')">🎙️ Áudio QG</button>
          ${phoneClean ? `<button class="btn-v9-lido" style="background:#25d366; color:#fff" onclick="window.open('https://wa.me/${phoneClean}','_blank')">💬 Cliente</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function setTab(t) {
  state.aba = t;
  // Resetar filtro ao mudar de aba
  state.filtro = 'todos'; 
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  
  // Mostrar/Esconder barra de triagem conforme a aba
  const filterBar = document.getElementById('filter-bar');
  if (t === 'atendimentos') filterBar.style.display = 'flex';
  else filterBar.style.display = 'none';

  // Encontrar a tab pelo texto/onclick (simplificado para o exemplo)
  const tabs = document.querySelectorAll('.tab');
  tabs.forEach(tab => { 
    const onclick = tab.getAttribute('onclick');
    if(onclick && onclick.includes(`setTab('${t}')`)) tab.classList.add('active'); 
  });

  const content = document.getElementById('aba-' + t);
  if (content) content.classList.add('active');
  
  // Garantir que o render seja chamado após a atualização do DOM das abas
  if (typeof render === 'function') {
    render();
  }
}

function filtrar(f) {
  state.filtro = f;
  // Feedback visual nos botões
  document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
  const target = Array.from(document.querySelectorAll('.filter-btn')).find(b => b.getAttribute('onclick').includes(`'${f}'`));
  if (target) target.classList.add('active');
  render();
}

function encerrar(id, btn) {
  const card = document.getElementById('card_' + id);
  card.classList.remove('lido');
  card.classList.add('encerrado');
  btn.textContent = '↩️ Reverter';
  btn.onclick = function() { reverter(id, btn); };
}

function marcarLido(id, btn) {
  const card = document.getElementById('card_' + id);
  card.classList.remove('encerrado');
  card.classList.add('lido');
  btn.textContent = '↩️ Reverter';
  btn.onclick = function() { reverter(id, btn); };
}

function reverter(id, btn) {
  const card = document.getElementById('card_' + id);
  card.classList.remove('encerrado', 'lido');
  // Simplificado: apenas recarrega o estado do card no render seguinte ou reseta botões
  render(); 
}

function copiarContexto(id) {
  const card = document.getElementById('card_' + id);
  const titulo = card.querySelector('.titulo').innerText;
  const desc = card.querySelector('.desc').innerText;
  const proximo = card.querySelector('.proximo').innerText;
  const texto = `CLIENTE: ${titulo}\nDETALHES: ${desc}\n${proximo}`;
  navigator.clipboard.writeText(texto).then(() => {
    const btn = card.querySelector('.btn-copiar');
    const original = btn.innerHTML;
    btn.innerHTML = '✔️ Copiado!';
    setTimeout(() => { btn.innerHTML = original; }, 2000);
  });
}

window.onload = () => { loadData(); setInterval(updateClock, 1000); };
</script>
