<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard CompetenceNet v9-Evolution</title>
    <style>
        :root { --primary: #1e293b; --accent: #3b82f6; --success: #22c55e; --danger: #ef4444; --warning: #f59e0b; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #f1f5f9; margin: 0; padding: 0; color: #1e293b; }
        
        header { background: var(--primary); color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 5px solid var(--accent); }
        header h1 { margin: 0; font-size: 1.4rem; letter-spacing: -0.5px; }
        
        .stats-bar { background: #cbd5e1; padding: 10px 20px; font-size: 0.85rem; font-weight: bold; border-bottom: 2px solid var(--primary); display: flex; justify-content: space-between; align-items: center; }
        
        .tabs { display: flex; background: #334155; padding: 8px 10px 0 10px; gap: 5px; position: sticky; top: 0; z-index: 1000; overflow-x: auto; }
        .tab { padding: 12px 20px; text-align: center; color: #94a3b8; cursor: pointer; border-radius: 8px 8px 0 0; font-weight: bold; font-size: 0.9rem; transition: all 0.2s; white-space: nowrap; border-bottom: 3px solid transparent; }
        .tab:hover { background: #475569; color: white; }
        .tab.active { background: #f1f5f9; color: var(--primary); border-bottom: 3px solid #f1f5f9; }
        
        .content { padding: 20px; max-width: 900px; margin: 0 auto; }
        
        .card { background: white; border: 3px solid var(--primary); border-radius: 12px; margin-bottom: 20px; padding: 20px; box-shadow: 6px 6px 0px var(--primary); transition: all 0.2s; position: relative; overflow: hidden; }
        .card.lido { opacity: 0.6; filter: grayscale(0.5); transform: scale(0.98); }
        .card.encerrado { border-color: var(--success); box-shadow: 6px 6px 0px var(--success); background: #f0fdf4; }
        
        .titulo { font-weight: 800; font-size: 1.2rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: flex-start; color: var(--primary); }
        .desc { font-size: 1rem; line-height: 1.5; margin-bottom: 15px; color: #334155; white-space: pre-wrap; }
        .proximo { background: #fef9c3; border-left: 4px solid var(--warning); padding: 8px 12px; font-weight: bold; font-size: 0.85rem; color: #854d0e; margin-bottom: 15px; }
        
        .actions { display: flex; flex-wrap: wrap; gap: 10px; }
        .btn-v9 { border: none; border-radius: 8px; padding: 12px 18px; font-weight: 800; cursor: pointer; font-size: 0.85rem; text-transform: uppercase; transition: all 0.1s; display: flex; align-items: center; gap: 6px; }
        .btn-v9:active { transform: translateY(2px); }
        
        .btn-encerrar { background: var(--success); color: white; }
        .btn-lido { background: #e2e8f0; color: #475569; }
        .btn-copiar { background: var(--accent); color: white; }
        .btn-qg { background: var(--warning); color: white; }
        .btn-wpp { background: #128c7e; color: white; }
        .btn-enviar { background: var(--success); color: white; border: 3px solid #14532d; padding: 10px 20px; border-radius: 8px; font-weight: 900; box-shadow: 4px 4px 0px #14532d; }
        
        .badge { background: var(--danger); color: white; padding: 2px 8px; border-radius: 20px; font-size: 0.75rem; margin-left: 5px; }
        
        @media (max-width: 600px) {
            .tab { padding: 10px 12px; font-size: 0.8rem; }
            .btn-v9 { flex: 1; justify-content: center; padding: 10px; }
        }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>CompetenceNet v9-Evolution</h1>
            <div id="ts-header" style="font-size: 0.85rem; font-weight: bold; opacity: 0.9;">Carregando...</div>
        </div>
        <button class="btn-enviar" onclick="enviarRelatorio()">🚀 ENVIAR PARA ZAPIA</button>
    </header>
    
    <div class="stats-bar" id="stats-bar">Stats: ...</div>

    <div class="tabs">
        <div class="tab active" onclick="setTab('urgente', this)">🔴 Urgente <span class="badge" id="count-urgente">0</span></div>
        <div class="tab" onclick="setTab('campo', this)">🟡 Campo <span class="badge" id="count-campo">0</span></div>
        <div class="tab" onclick="setTab('financeiro', this)">💰 Finan <span class="badge" id="count-financeiro">0</span></div>
        <div class="tab" onclick="setTab('empresa', this)">🏢 Empresa</div>
        <div class="tab" onclick="setTab('concluido', this)">✅ Resolvidos</div>
    </div>

    <div class="content" id="main-content">
        <!-- Cards aqui -->
    </div>

    <script>
        const state = {
            currentTab: 'urgente',
            data: {"stats": {"atendimentos": 10, "financeiro": 2, "campo": 2, "instalacao": 1, "concluido": 1}, "atendimentos": [{"id": "a8deee7e", "cliente": "17XXX - Dóris Schmidt (César) (19:40):", "detalhes": "Instalação concluída por Fábio, mas com roteador C20 (não configurou ZTE). Pendente ajuste de login/CLI por Júnior.", "proximo": "📅 Próximo contato: Imediato", "phone": "", "status": "urgente"}, {"id": "df8c78ae", "cliente": "17286 - Poliana (19:42):", "detalhes": "Reclamação de YouTube travando na TV. Teste com 4 celulares OK. Júnior suspeita de problema na TV ou rede local, não na internet.", "proximo": "📅 Próximo contato: 04/07", "phone": "555196383299", "status": "urgente"}, {"id": "8bf0bace", "cliente": "17291 - Thais Moura (19:43):", "detalhes": "Lentidão recorrente à noite (YouTube rodando). Júnior analisando.", "proximo": "📅 Próximo contato: 04/07", "phone": "555197975754", "status": "urgente"}, {"id": "2322bf2d", "cliente": "17174 - Itamara Freitas (17:27):", "detalhes": "Problema com bateria/carregador.", "proximo": "📅 Próximo contato: 04/07", "phone": "555197649977", "status": "urgente"}, {"id": "64c5af64", "cliente": "17085 - Dari Peixoto (17:03):", "detalhes": "Equipamento não liga. Urgência para visita no domingo.", "proximo": "📅 Próximo contato: 04/07", "phone": "5551997947536", "status": "urgente"}, {"id": "a96ec585", "cliente": "16936 - Valdson (16:18):", "detalhes": "Reclamação de suporte pendente na Vila Vargas.", "proximo": "📅 Próximo contato: 04/07", "phone": "555190114165", "status": "urgente"}, {"id": "639cdc39", "cliente": "16878 - Mateus Schuck (19:02):", "detalhes": "Insiste no upgrade de 100Mb hoje. Ofereceu PIX de amigo. Júnior precisa decidir se libera sem o pagamento na conta dele.", "proximo": "", "phone": "555195971317", "status": "andamento"}, {"id": "4d3154a5", "cliente": "Grasi E Oséias (17:48):", "detalhes": "Dúvida sobre parcelamento da taxa de R$ 450.", "proximo": "", "phone": "", "status": "andamento"}, {"id": "262fbbe7", "cliente": "10611 - Fábio Cenedeze (19:45):", "detalhes": "Já saiu da Porteira 7. Não levará a caminhonete para Lu hoje/amanhã (exaustão).", "proximo": "", "phone": "555198761785", "status": "andamento"}, {"id": "c97a1e71", "cliente": "Lu Vivo Particular (17:25):", "detalhes": "Questionamentos logísticos e financeiros.", "proximo": "", "phone": "", "status": "andamento"}], "financeiro": [{"id": "bbdf7eb1", "cliente": "Despesa Lu (08:31):", "detalhes": "Lançar despesa.", "proximo": "", "phone": "", "status": "financeiro"}, {"id": "b5ba8311", "cliente": "Cadastro Jarbas (FASA):", "detalhes": "Processar.", "proximo": "", "phone": "", "status": "financeiro"}], "campo": [{"id": "a8deee7e", "cliente": "17XXX - Dóris Schmidt (César) (19:40):", "detalhes": "Instalação concluída por Fábio, mas com roteador C20 (não configurou ZTE). Pendente ajuste de login/CLI por Júnior.", "proximo": "📅 Próximo contato: Imediato", "phone": "", "status": "campo"}, {"id": "262fbbe7", "cliente": "10611 - Fábio Cenedeze (19:45):", "detalhes": "Já saiu da Porteira 7. Não levará a caminhonete para Lu hoje/amanhã (exaustão).", "proximo": "", "phone": "555198761785", "status": "campo"}], "instalacao": [{"id": "a8deee7e", "cliente": "17XXX - Dóris Schmidt (César) (19:40):", "detalhes": "Instalação concluída por Fábio, mas com roteador C20 (não configurou ZTE). Pendente ajuste de login/CLI por Júnior.", "proximo": "📅 Próximo contato: Imediato", "phone": "", "status": "instalacao"}], "concluidos": [{"id": "1ecddd21", "cliente": "16085 - Lucas Holzschuh:", "detalhes": "Resolvido.", "proximo": "", "phone": "5551981193757", "status": "concluido"}], "empresa_financeiro": {"mes": "Maio/2026 (Consolidado)", "resumo": {"receita_total": "---", "despesa_total": "51.610,36", "saldo": "---"}, "pendencias": [{"titulo": "MK Solutions", "detalhes": "Sistema", "vencimento": "5/07", "valor": "997.0"}, {"titulo": "Dobrobit Telecom", "detalhes": "Link", "vencimento": "10/07", "valor": "300.0"}, {"titulo": "Bemobi", "detalhes": "Cobrança", "vencimento": "10/07", "valor": "Consultar"}, {"titulo": "Mhnet (TecPar)", "detalhes": "Link", "vencimento": "11/07", "valor": "500.0"}, {"titulo": "V Mix / Chatmix", "detalhes": "Chatbot", "vencimento": "15/07", "valor": "249.9"}, {"titulo": "Claro", "detalhes": "Telefonia", "vencimento": "15/07", "valor": "Consultar"}, {"titulo": "Omie / RR64", "detalhes": "ERP", "vencimento": "15/07", "valor": "450.0"}, {"titulo": "GGNET / ALT Telecom", "detalhes": "Link", "vencimento": "18/07", "valor": "2500.0"}, {"titulo": "Teleplus / Sync360", "detalhes": "Link", "vencimento": "25/07", "valor": "1750.0"}, {"titulo": "ALGCOM", "detalhes": "Link", "vencimento": "26/07", "valor": "738.38"}, {"titulo": "Ferenz Networks", "detalhes": "Storage", "vencimento": "26/07", "valor": "79.9"}, {"titulo": "RGE Sul (Energia)", "detalhes": "Energia", "vencimento": "18/07", "valor": "248.0"}, {"titulo": "Acesso Line (ALT)", "detalhes": "Link", "vencimento": "29/07", "valor": "Consultar"}]}, "update_ts": "04/07/2026 20:00"}
        };

        function setTab(tab, el) {
            state.currentTab = tab;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            render();
            window.scrollTo(0,0);
        }

        function render() {
            const container = document.getElementById('main-content');
            container.innerHTML = '';
            
            let list = [];
            if (state.currentTab === 'urgente') list = state.data.atendimentos;
            else if (state.currentTab === 'campo') list = state.data.campo;
            else if (state.currentTab === 'financeiro') list = state.data.financeiro;
            else if (state.currentTab === 'concluido') list = state.data.concluidos;
            else if (state.currentTab === 'empresa') { renderFinanceiroEmpresa(); return; }

            if (!list || list.length === 0) {
                container.innerHTML = '<div style="text-align:center; padding:50px; color:#94a3b8; font-weight:bold;">☕ NADA PENDENTE NESTA ABA! <br><small>Tudo limpo por enquanto.</small></div>';
                return;
            }

            list.forEach(item => {
                const card = document.createElement('div');
                card.id = `card-${item.id}`;
                card.className = 'card';
                const qgLink = `https://wa.me/555194143224-1540688164@g.us?text=${encodeURIComponent('Sobre ' + (item.cliente || item.titulo) + ': ')}`;
                
                card.innerHTML = `
                    <div class="titulo">${item.cliente || item.titulo}</div>
                    <div class="desc">${item.detalhes || item.descricao}</div>
                    ${item.proximo ? `<div class="proximo">${item.proximo}</div>` : ''}
                    <div class="actions">
                        <button class="btn-v9 btn-encerrar" onclick="marcar('${item.id}', 'encerrado')">✅ Encerrar</button>
                        <button class="btn-v9 btn-lido" onclick="marcar('${item.id}', 'lido')">👁️ Lido</button>
                        <button class="btn-v9 btn-copiar" onclick="copiarTexto('${item.id}', '${item.detalhes || item.descricao}')">📋 Copiar</button>
                        <button class="btn-v9 btn-qg" onclick="window.open('${qgLink}')">🎙️ QG</button>
                        ${item.phone ? `<button class="btn-v9 btn-wpp" onclick="window.open('https://wa.me/${item.phone}')">💬 Cli</button>` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderFinanceiroEmpresa() {
            const container = document.getElementById('main-content');
            const fin = state.data.empresa_financeiro;
            if (!fin) return;

            let html = `
                <div class="card" style="background: var(--primary); color: white; border-color: var(--accent);">
                    <div class="titulo" style="border-color: #334155; color: white;">💰 Resumo: ${fin.mes}</div>
                    <p style="font-size: 1.3rem; font-weight: 900;">DESPESA TOTAL: <span style="color: #fda4af;">R$ ${fin.resumo.despesa_total}</span></p>
                </div>
                <h2 style="margin: 30px 0 15px 0; font-size: 1.2rem; display: flex; align-items: center; gap: 10px;">
                    📅 Contratos de Julho
                </h2>
            `;

            fin.pendencias.forEach(p => {
                html += `
                    <div class="card">
                        <div class="titulo" style="color: var(--accent);">${p.titulo}</div>
                        <div class="desc" style="font-weight: 800; font-size: 1.1rem;">R$ ${p.valor}</div>
                        <div class="proximo">Vencimento: <b>${p.vencimento}</b> | Categoria: ${p.detalhes}</div>
                    </div>
                `;
            });
            container.innerHTML = html;
        }

        function marcar(id, status) {
            const card = document.getElementById(`card-${id}`);
            const isSet = card.classList.contains(status);
            card.classList.remove('lido', 'encerrado');
            if (!isSet) card.classList.add(status);
        }

        function copiarTexto(id, texto) {
            navigator.clipboard.writeText(texto);
            const btn = event.target;
            const original = btn.innerText;
            btn.innerText = '✅ COPIADO!';
            setTimeout(() => btn.innerText = original, 1500);
        }

        function enviarRelatorio() {
            const encerrados = document.querySelectorAll('.card.encerrado');
            const lidos = document.querySelectorAll('.card.lido');
            if (encerrados.length === 0 && lidos.length === 0) { alert("Nada marcado para enviar!"); return; }
            let msg = "🚀 *RELATÓRIO DASHBOARD COMPETENCENET*\n\n";
            encerrados.forEach(c => msg += `✅ ENCERRADO: ${c.querySelector('.titulo').innerText}\n`);
            lidos.forEach(c => msg += `👁️ LIDO: ${c.querySelector('.titulo').innerText}\n`);
            window.open(`https://wa.me/5551997760717?text=${encodeURIComponent(msg)}`);
        }

        // Init
        document.getElementById('ts-header').textContent = 'Última atualização: ' + state.data.update_ts;
        document.getElementById('count-urgente').textContent = state.data.stats.atendimentos;
        document.getElementById('count-campo').textContent = state.data.stats.campo;
        document.getElementById('count-financeiro').textContent = state.data.stats.financeiro;
        document.getElementById('stats-bar').textContent = `Total Ativo: ${state.data.stats.atendimentos + state.data.stats.campo + state.data.stats.financeiro} itens pendentes`;
        render();
    </script>
</body>
</html>
